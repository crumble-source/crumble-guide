```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クランブル徹底攻略｜キャラランク</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;

  color: white;
  min-height: 100vh;

  background:
    radial-gradient(circle at 15% 15%, #6048ff55, transparent 30%),
    radial-gradient(circle at 85% 25%, #00c8ff35, transparent 30%),
    radial-gradient(circle at 50% 90%, #ff3db735, transparent 35%),
    linear-gradient(135deg, #07091b, #121a3b, #080b20);

  overflow-x: hidden;
}

/* キラキラ背景 */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    radial-gradient(circle, #ffffff88 1px, transparent 1px);

  background-size: 45px 45px;
  opacity: .25;

  pointer-events: none;
}

/* ヘッダー */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  padding: 18px 0;

  background: rgba(7, 9, 27, .75);
  backdrop-filter: blur(15px);

  border-bottom: 1px solid #ffffff18;
}

.container {
  width: min(1100px, 92%);
  margin: auto;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 21px;
  font-weight: 900;
}

.logo span {
  color: #8c7cff;
}

nav a {
  color: #cdd4ff;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

nav a:hover {
  color: white;
}

/* ヒーロー */

.hero {
  text-align: center;
  padding: 80px 20px 50px;
}

.badge {
  display: inline-block;

  padding: 8px 16px;
  margin-bottom: 18px;

  border-radius: 999px;

  background: #8c7cff22;
  border: 1px solid #9b8dff66;

  color: #cfc8ff;
  font-size: 13px;
}

h1 {
  font-size: clamp(40px, 7vw, 72px);
  font-weight: 950;
}

.gradient {
  background:
    linear-gradient(
      90deg,
      white,
      #a99aff,
      #5ee7ff
    );

  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 680px;
  margin: 20px auto;

  color: #aeb8dc;
  line-height: 1.8;
}

.update {
  color: #747fa7;
  font-size: 12px;
}

/* 検索 */

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;

  padding: 15px;
  margin-bottom: 30px;

  background: #ffffff09;
  border: 1px solid #ffffff14;
  border-radius: 18px;

  backdrop-filter: blur(15px);
}

input,
select {
  padding: 12px 15px;

  border-radius: 12px;
  border: 1px solid #ffffff18;

  background: #11162f;
  color: white;

  outline: none;
}

input {
  flex: 1;
  min-width: 200px;
}

/* ランク */

.rank {
  padding: 20px;
  margin-bottom: 22px;

  border-radius: 24px;

  background: #0c1028bb;
  border: 1px solid #ffffff15;

  backdrop-filter: blur(15px);

  box-shadow:
    0 20px 60px #00000035;
}

.rank-title {
  display: flex;
  align-items: center;
  gap: 15px;

  margin-bottom: 18px;
}

.rank-icon {
  width: 58px;
  height: 58px;

  display: grid;
  place-items: center;

  border-radius: 17px;

  font-size: 25px;
  font-weight: 1000;
}

.SS .rank-icon {
  background: linear-gradient(135deg, #ffd43b, #ff7625);
  box-shadow: 0 0 30px #ff9f3055;
}

.S .rank-icon {
  background: linear-gradient(135deg, #ff5f91, #a93cff);
}

.A .rank-icon {
  background: linear-gradient(135deg, #44ddff, #5278ff);
}

.B .rank-icon {
  background: linear-gradient(135deg, #687695, #3f4967);
}

.rank-title h2 {
  font-size: 23px;
}

.rank-title p {
  color: #858fb4;
  font-size: 13px;
}

/* キャラカード */

.cards {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(240px, 1fr));

  gap: 15px;
}

.card {
  position: relative;

  overflow: hidden;

  padding: 16px;

  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      #ffffff12,
      #ffffff04
    );

  border: 1px solid #ffffff14;

  transition: .25s;
}

.card:hover {
  transform: translateY(-6px);

  border-color: #9585ff88;

  box-shadow:
    0 15px 40px #5745c944;
}

/* キャラ画像 */

.character-image {
  height: 150px;

  margin-bottom: 15px;

  border-radius: 15px;

  display: grid;
  place-items: center;

  color: #737da2;

  background:
    radial-gradient(
      circle at center,
      #ffffff15,
      #ffffff03
    );
}

.character-image img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  border-radius: 15px;
}

/* キャラ名 */

.character-name {
  font-size: 19px;
  font-weight: 900;
}

.character-role {
  color: #8b96ba;
  font-size: 12px;

  margin: 5px 0 14px;
}

/* ステータス */

.stats {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;
}

.stat {
  color: #8d97b8;
  font-size: 11px;
}

.bar {
  height: 5px;

  margin-top: 5px;

  background: #252b4b;

  border-radius: 99px;

  overflow: hidden;
}

.bar span {
  display: block;

  height: 100%;

  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      #8170ff,
      #55dfff
    );
}

/* スコア */

.score {
  margin-top: 14px;

  text-align: right;

  font-size: 17px;
  font-weight: 900;

  color: #bcb2ff;
}
/* 注意書き */

.note {
  margin: 30px 0;

  padding: 20px;

  border-radius: 18px;

  background: #ffc4430d;

  border: 1px solid #ffc44322;

  color: #c8cee2;

  line-height: 1.7;

  font-size: 13px;
}

/* フッター */

footer {
  padding: 50px 0 35px;

  text-align: center;

  color: #687394;

  font-size: 12px;
}

/* スマホ */

@media (max-width: 650px) {

  nav {
    display: none;
  }

  .hero {
    padding-top: 50px;
  }

  .cards {
    grid-template-columns: 1fr;
  }

}
</style>
</head>

<body>

<header>

<div class="container nav">

  <div class="logo">
    🍪 クランブル<span>徹底攻略</span>
  </div>

  <nav>
    <a href="#">ホーム</a>
    <a href="#">キャラランク</a>
    <a href="#">攻略情報</a>
    <a href="#">最新情報</a>
  </nav>

</div>

</header>


<main class="container">

<section class="hero">

  <div class="badge">
    ⚡ PVP META / CHARACTER RANKING
  </div>

  <h1>
    <span class="gradient">
      最強キャラランキング
    </span>
  </h1>

  <p>
    クランブルの現環境を徹底分析！
    火力・耐久・機動力・扱いやすさを
    総合評価してランキング化。
  </p>

  <div class="update">
    最終更新：2026年8月12日
  </div>

</section>


<!-- 検索 -->

<section class="controls">

  <input
    id="search"
    type="text"
    placeholder="🔎 キャラクターを検索..."
  >

  <select id="rankFilter">

    <option value="ALL">
      すべてのランク
    </option>

    <option value="SS">SSランク</option>
    <option value="S">Sランク</option>
    <option value="A">Aランク</option>
    <option value="B">Bランク</option>

  </select>

</section>


<div id="ranking"></div>


<div class="note">

💡 <strong>ランクの見方</strong><br>

SS：環境トップクラス<br>
S：非常に強力<br>
A：十分活躍できる<br>
B：編成や使い方次第で活躍

</div>

</main>


<footer>

© クランブル徹底攻略 ｜ 非公式攻略サイト

</footer>


<script>

const characters = [

  {
    rank: "SS",
    name: "ザクロ味クッキー",
    role: "万能アタッカー",
    score: "10.0",
    stats: [95,88,96,84]
  },

  {
    rank: "SS",
    name: "名もなきわんケーキ",
    role: "高火力・高機動",
    score: "9.8",
    stats: [98,78,97,80]
  },

  {
    rank: "S",
    name: "ハーブ味クッキー",
    role: "サポート・回復",
    score: "9.3",
    stats: [76,94,80,91]
  },

  {
    rank: "S",
    name: "ミルキーウェイ味クッキー",
    role: "コントロール",
    score: "9.1",
    stats: [84,87,82,86]
  },

  {
    rank: "A",
    name: "オーブン放浪者クッキー",
    role: "バランス型",
    score: "8.5",
    stats: [83,81,79,88]
  },

  {
    rank: "B",
    name: "エスプレッソ味クッキー",
    role: "範囲アタッカー",
    score: "7.6",
    stats: [88,65,68,74]
  }

];


const rankInfo = {

  SS: "環境トップクラス",
  S: "非常に強力",
  A: "十分活躍できる",
  B: "編成次第で活躍"

};


const statNames = [
  "🔥 火力",
  "🛡️ 耐久",
  "💨 機動力",
  "🎯 扱いやすさ"
];


function renderRanking() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const filter =
    document
      .getElementById("rankFilter")
      .value;


  const container =
    document.getElementById("ranking");


  container.innerHTML = "";


  ["SS","S","A","B"].forEach(rank => {

    if (
      filter !== "ALL" &&
      filter !== rank
    ) return;


    const list =
      characters.filter(character =>

        character.rank === rank &&
        character.name
          .toLowerCase()
          .includes(search)

      );


    if (list.length === 0) return;


    const section =
      document.createElement("section");

    section.className =
      `rank ${rank}`;


    section.innerHTML = `

      <div class="rank-title">

        <div class="rank-icon">
          ${rank}
        </div>

        <div>

          <h2>
            ${rankInfo[rank]}
          </h2>

          <p>
            ${list.length}キャラクター
          </p>

        </div>

      </div>


      <div class="cards">

        ${list.map(character => `

          <article class="card">

            <div class="character-image">
              キャラクター画像
            </div>

            <div class="character-name">
              ${character.name}
            </div>

            <div class="character-role">
              ${character.role}
            </div>


            <div class="stats">

              ${character.stats.map(
                (value,index) => `

                  <div class="stat">

                    ${statNames[index]}

                    <div class="bar">

                      <span
                        style="width:${value}%">
                      </span>

                    </div>

                  </div>

                
              ).join("")}

            </div>


            <div class="score">
              ⭐ ${character.score} / 10
            </div>

          </article>

        `).join("")}

      </div>
    `;


    container.appendChild(section);

  });

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    renderRanking
  );


document
  .getElementById("rankFilter")
  .addEventListener(
    "change",
    renderRanking
  );


renderRanking();

</script>

</body>
</html>
```
